<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOUO</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=static-background-1">
<link rel="stylesheet" href="css/components.css?v=owner-music-2">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <img id="bgImage" src="assets/images/background.jpg?v=346523" alt="">
  <div class="overlay" id="overlayDark"></div>
  <div class="overlay purple" id="overlayPurple"></div>
</div>

<div class="decor" aria-hidden="true">
  <img class="decor-art" src="assets/images/decorations/wordmark.png" alt="">
</div>

<div class="stage-wrap">
<main class="stage">
  <h1 class="sr">YOUO</h1>

  <section class="panel birthday" aria-label="Birthday countdown">
    <span class="cs">✦</span>
    <div class="birthday-label">Date of birth</div>
    <div class="birthday-date" id="birthDate">2005/02/06</div>
    <i class="rule"></i>
    <div class="birthday-countdown" id="birthdayCountdown" role="timer" aria-live="off"></div>
  </section>

  <section class="panel player" aria-label="Music player">
    <img id="plCover" class="cover" src="" alt="Album artwork">
    <div class="p-title" id="plTitle">—</div>
    <div class="p-artist" id="plArtist">—</div>
    <div class="eq" id="plEq" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    <div class="bar" id="plBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="bar-fill" id="plFill"></div></div>
    <div class="times"><span id="plCur">0:00</span><span id="plDur">0:00</span></div>
    <div class="p-ctrl">
      <button class="ib" id="plShuffle" aria-label="Shuffle" aria-pressed="false"><i data-icon="shuffle"></i></button>
      <button class="ib" id="plPrev" aria-label="Previous"><i data-icon="prev"></i></button>
      <button class="ib play" id="plPlay" aria-label="Play"><i data-icon="play"></i></button>
      <button class="ib" id="plNext" aria-label="Next"><i data-icon="next"></i></button>
      <button class="ib" id="plRepeat" aria-label="Repeat" aria-pressed="false"><i data-icon="repeat"></i></button>
    </div>
    <div class="p-msg" id="plMsg" role="status"></div>
  </section>

  <nav class="socials" aria-label="Social links">
    <a class="social s-tiktok" data-key="tiktok" href="#" target="_blank" rel="noopener noreferrer"><img src="assets/icons/social/tiktok.svg" alt=""><span>TikTok</span><i data-icon="arrow"></i></a>
    <a class="social s-instagram" data-key="instagram" href="#" target="_blank" rel="noopener noreferrer"><img src="assets/icons/social/instagram.svg" alt=""><span>Instagram</span><i data-icon="arrow"></i></a>
    <a class="social s-discord" data-key="discord" href="#" target="_blank" rel="noopener noreferrer"><img src="assets/icons/social/discord.svg" alt=""><span>Discord</span><i data-icon="arrow"></i></a>
    <a class="social s-facebook" data-key="facebook" href="#" target="_blank" rel="noopener noreferrer"><img src="assets/icons/social/facebook.svg" alt=""><span>Facebook</span><i data-icon="arrow"></i></a>
  </nav>

  <div class="dock-wrap">
    <div class="dock panel" role="toolbar" aria-label="Controls">
      <button class="ib" id="btnSettings" aria-label="Settings" aria-expanded="false" aria-controls="settings"><i data-icon="settings"></i></button>
      <span class="sep"></span>
      <button class="ib" id="btnFull" aria-label="Fullscreen"><i data-icon="full"></i></button>
    </div>
    <div class="panel settings" id="settings" hidden>
      <h2>Settings</h2>
      <label>Dark overlay <input type="range" id="rngDark" min="0" max="90" value="12"></label>
      <label>Purple overlay <input type="range" id="rngPurple" min="0" max="80" value="0"></label>
      <label>Background image file <input type="file" id="fileImage" accept="image/*"></label>
      <label>Background image URL <input type="text" id="urlImage" placeholder="assets/images/background.jpg"></label>
      <div class="row"><button class="chip" id="applyImage">Apply</button><button class="chip" id="resetSettings">Reset</button></div>
    </div>
  </div>
</main>
</div>

<a class="owner-entry" href="?owner=1">Owner</a>
<div class="owner-backdrop" id="ownerBackdrop" hidden>
  <section class="panel owner-panel" id="ownerPanel" role="dialog" aria-modal="true" aria-labelledby="ownerTitle">
    <button class="owner-close" id="ownerClose" type="button" aria-label="Close owner panel">×</button>
    <h2 id="ownerTitle">Music settings</h2>
    <form id="ownerLoginForm" class="owner-form">
      <label>Email <input id="ownerEmail" type="email" autocomplete="username" required></label>
      <label>Password <input id="ownerPassword" type="password" autocomplete="current-password" required></label>
      <button class="chip" type="submit">Sign in</button>
    </form>
    <form id="ownerSongForm" class="owner-form" hidden>
      <label>Song title <input id="ownerSongTitle" type="text" maxlength="160" required></label>
      <label>Artist <input id="ownerSongArtist" type="text" maxlength="160" required></label>
      <label>Audio file <input id="ownerAudioFile" type="file" accept="audio/*" required></label>
      <label>Cover image <input id="ownerCoverFile" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <button class="chip" type="submit">Save song for everyone</button>
      <button class="chip" id="ownerSignOut" type="button">Sign out</button>
    </form>
    <p class="owner-status" id="ownerStatus" role="status" aria-live="polite"></p>
  </section>
</div>

<script src="js/config.js?v=owner-music-2"></script>
<script src="js/birthday.js"></script>
<script src="js/music-player.js?v=owner-music-2"></script>
<script src="js/owner-music.js?v=owner-music-2"></script>
<script src="js/background.js"></script>
<script src="js/controls.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js?v=owner-music-2"></script>
</body>
</html>
